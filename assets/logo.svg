  <path d="M252 118c-2-28 6-48 22-58" fill="none" stroke="#5A3A28" stroke-width="11" stroke-linecap="round"/>
  <path filter="url(#dither)" fill="url(#leaf)" d="M272 78c28-22 72-12 88 22-18 16-52 20-82 4z"/>
  <path d="M278 86c22-6 48 4 64 20" fill="none" stroke="#2A5E2C" stroke-width="3" stroke-linecap="round"/>

    <linearGradient id="leaf" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#7EC45A"/>
      <stop offset="100%" stop-color="#2F7A32"/>
    </linearGradient>
  </defs>
  <path filter="url(#dither)" fill="url(#skin)" d="M256 108c-48 2-86 48-94 108-12 86 10 168 62 204 16 12 48 18 72 0 52-36 74-118 62-204-8-60-46-106-94-108z"/>

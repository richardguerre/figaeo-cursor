        <feFuncA type="discrete" tableValues="0 1 0 1 0 1 0 1"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="d" mode="multiply"/>
    </filter>
    <linearGradient id="skin" x1="28%" y1="18%" x2="78%" y2="88%">
      <stop offset="0%" stop-color="#E08AD0"/>
      <stop offset="38%" stop-color="#9B4EC7"/>
